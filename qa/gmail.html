<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA - owner@example.test - Gmail</title>
<style>body{font:14px Arial;margin:0;background:#eeeaf5;color:#202124}main{max-width:1040px;margin:35px auto;background:#fff;border-radius:16px;padding:28px;box-sizing:border-box}.message{padding:20px}.reply-host{position:relative}.ip.iq{margin:0;background:white;border:1px solid #dadce0;border-radius:14px;padding:16px;box-shadow:0 2px 6px #0002}.aoD{display:flex;gap:8px;align-items:center}.Am{min-height:120px;padding:16px 0;outline:none}.footer{display:flex;gap:10px;padding-top:15px}.integration{color:#006865;display:flex;flex-wrap:wrap;gap:18px;margin:20px 0}.fixture-controls{padding:12px;display:flex;gap:12px;flex-wrap:wrap}button,select{font:inherit}button{cursor:pointer}#events{white-space:pre-wrap;font:12px monospace;overflow-wrap:anywhere;margin:20px}body.dark,body.dark main,body.dark .ip.iq{background:#202124;color:#f3f4f6}body.dark .integration{color:#7ce8d9}body.zoom main{max-width:680px}body.zoom{font-size:20px}@media(max-width:600px){main{margin:8px;padding:10px}.message{padding:10px}}</style></head><body>
<div class="fixture-controls"><strong>Local QA fixture</strong><label>Response <select id="scenario"><option>Success</option><option>Slow success</option><option>Network error</option><option>Session expired</option><option>Draft limit</option><option>Missing price</option></select></label><label>Send label <select id="language"><option value="Send">English</option><option value="Enviar">Spanish</option><option value="送信">Japanese</option></select></label><button id="auth">Sign out of Pranan</button><button id="dark">Dark theme</button><button id="zoom">Large layout</button><button id="recipient">Change recipient</button><button id="second">Open second draft</button></div>
<main class="aeH nH if" role="main"><h2 class="hP">Project proposal</h2><div class="adn"><div class="gs message"><span class="gD" email="alex@example.test" name="Alex">Alex</span><div class="ii gt"><div class="a3s aiL">Can you confirm the scope, timing, and cost by Friday?</div></div></div></div>
<div class="reply-host"><div class="ip iq"><div class="aoD hl"><span>To</span><span data-hovercard-id="alex@example.test" name="Alex">Alex</span></div><div class="integration">Write with Breeze <span>Templates</span><span>Meetings</span><span>Tasks</span><span>Snippets</span></div><div class="Am aiL"><div contenteditable="true" role="textbox" aria-label="Message Body" g_editable="true"><div class="gmail_signature" data-smartmail="gmail_signature">Best,<br>Owner</div></div></div><div class="aDh footer"><div class="btC" style="display:flex;align-items:center;gap:10px;width:100%"><div class="gU Up"><div class="dC" style="display:flex"><div id="send" role="button" aria-label="Send" data-tooltip="Send" style="background:#f50;color:white;padding:8px 25px;border-radius:20px 0 0 20px">Send (disabled in fixture)</div><div role="button" aria-haspopup="true" aria-label="More send options" data-tooltip="More send options" style="background:#f50;color:white;padding:8px 10px;border-radius:0 20px 20px 0;margin-left:1px">&#9662;</div></div></div><div class="gU"><div role="button" aria-label="Formatting options" data-tooltip="Formatting options" style="padding:8px">Aa</div></div></div></div></div></div></main><pre id="events" aria-label="QA event log"></pre>
<script type="module">
const listeners=new Set(); const cancelled=new Set(); const saved={}; let signedIn=true;
// Stands in for the worker telling Gmail tabs about sign-in and sign-out.
function setSignedIn(next){signedIn=next;document.querySelector('#auth').textContent=next?'Sign out of Pranan':'Finish sign-in';for(const fn of listeners)fn({type:'AUTH_STATE_CHANGED',payload:{signedIn:next}},{},()=>{})}
class FakeSpeechRecognition {
 continuous=false;interimResults=false;lang='';onstart=null;onresult=null;onerror=null;onend=null;
 start(){this.onstart?.();setTimeout(()=>this.onresult?.({results:[{0:{transcript:'Thank them and ask for confirmation by Friday'},isFinal:true}]}),100)}
 stop(){this.onend?.()}
}
window.webkitSpeechRecognition=FakeSpeechRecognition;
function log(event){document.querySelector('#events').textContent=JSON.stringify(event,null,2)}
window.chrome={runtime:{id:'pranan-local-fixture',getManifest:()=>({version:'0.8.63-QA'}),getURL:path=>path,onMessage:{addListener:fn=>listeners.add(fn),removeListener:fn=>listeners.delete(fn),hasListeners:()=>true},sendMessage:async msg=>{
 if(msg.type==='GET_AUTH_STATE')return{signedIn};
 if(msg.type==='BEGIN_COMPANION_LOGIN'){log({signIn:'The worker would open the Pranan sign-in tab here. Press "Finish sign-in" to complete it.'});return{ok:true}}
 if(msg.type==='GET_REPLY_INTENTS')return{intents:['Ask for the scope','Confirm Friday','Decline politely']};
 if(msg.type==='GET_RELATIONSHIP_TIER')return {name:'Alex',tier:'client'};
 if(msg.type==='CANCEL_INLINE_DRAFT'){cancelled.add(msg.payload.requestId);return{ok:true}}
 if(msg.type==='INLINE_DRAFT_REQUEST'){
  const mode=document.querySelector('#scenario').value;log({request:msg.payload});
  setTimeout(()=>{if(cancelled.has(msg.payload.requestId)){log({cancelled:true});return;}
   const fail=mode==='Network error'||mode==='Session expired'||mode==='Draft limit'||mode==='Missing price';
   const action=mode==='Session expired'?{kind:'sign_in',label:'Sign in to Pranan',message:'You are signed out of Pranan. Sign in to keep drafting. Your text has not changed.'}:mode==='Draft limit'?{kind:'upgrade',label:'Upgrade plan',url:'https://app.pranan.ai/settings/billing',message:"You have used this month's drafts on your plan. Upgrade to keep drafting."}:undefined;
   if(mode==='Session expired')setSignedIn(false);
   const response={type:fail?'DRAFT_SKIPPED':'INSERT_DRAFT',payload:{requestId:msg.payload.requestId,editorId:msg.payload.editorId,text:'Hi Alex,\nCould you confirm the scope, timing and cost by Friday?',action,message:mode==='Missing price'?'What price and currency should I quote?':mode==='Session expired'?'Your Pranan session expired. Click the Pranan icon in the Chrome toolbar to sign back in, then try again.':mode==='Draft limit'?"You have used this month's drafts on your plan. Upgrade at app.pranan.ai/settings/billing to keep drafting.":'Pranan could not connect. Your draft has not changed.'}};
   for(const fn of listeners)fn(response,{},result=>log({result}));
  },mode==='Slow success'?7000:500);return{ok:true};
 }
 return{};
}},storage:{local:{get:async key=>({[key]:saved[key]}),set:async values=>Object.assign(saved,values)},onChanged:{addListener:()=>{}}}};
document.querySelector('#dark').onclick=()=>{document.body.classList.toggle('dark');document.querySelectorAll('.pranan-compact').forEach(el=>el.setAttribute('data-theme',document.body.classList.contains('dark')?'dark':'light'))};
document.querySelector('#auth').onclick=()=>setSignedIn(!signedIn);
// Constructed, not captured from Gmail: only the visible Send text changes, the structure stays.
document.querySelector('#language').onchange=event=>{const send=document.querySelector('#send');const label=event.target.value;send.setAttribute('aria-label',label);send.setAttribute('data-tooltip',label);send.textContent=label+' (disabled in fixture)'};
document.querySelector('#zoom').onclick=()=>document.body.classList.toggle('zoom');
document.querySelector('#recipient').onclick=()=>{const chip=document.querySelector('.aoD [data-hovercard-id]');chip.setAttribute('data-hovercard-id','beth@example.test');chip.textContent='Beth';};
document.querySelector('#second').onclick=()=>{const dialog=document.createElement('section');dialog.setAttribute('role','dialog');dialog.className='M9';dialog.innerHTML='<input name="subjectbox" aria-label="Subject" value="Separate email"><div class="aoD"><span data-hovercard-id="beth@example.test">Beth</span></div><div class="Am aiL"><div contenteditable="true" role="textbox" aria-label="Second Message Body" g_editable="true">Independent draft</div></div><div role="button" aria-label="Send" data-tooltip="Send">Send disabled</div>';const host=document.createElement('main');host.append(dialog);document.body.append(host)};
// ?send=Enviar (or any label) sets the Send text before the content script looks for the button.
const initialSend=new URLSearchParams(location.search).get('send');
if(initialSend){const select=document.querySelector('#language');if(![...select.options].some(o=>o.value===initialSend))select.add(new Option(initialSend,initialSend));select.value=initialSend;select.dispatchEvent(new Event('change'))}
await import('/src/content/gmail/index.ts');
</script></body></html>
